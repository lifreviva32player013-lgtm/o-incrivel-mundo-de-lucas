name: Gerar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Extrair pacote do jogo
        run: unzip -q O-Incrivel-Mundo-de-Lucas-Completo.zip -d game
      - name: Instalar dependências e preparar Capacitor
        working-directory: game
        run: |
          npm install --no-package-lock
          npm run prepare
          npx cap sync android
      - name: Compilar APK
        working-directory: game/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publicar APK para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: O INCRÍVEL MUNDO DE LUCAS — Android
          body: APK Android gerado automaticamente pelo GitHub Actions.
          files: game/android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
